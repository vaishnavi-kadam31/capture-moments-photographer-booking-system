<div class="cm-calendar">
  <div class="d-flex justify-content-between align-items-center mb-2">
    {% if calendar.prev %}<a class="btn btn-sm btn-outline-light" href="?month={{ calendar.prev }}" aria-label="Previous month"><i class="bi bi-chevron-left"></i></a>{% else %}<span></span>{% endif %}
    <strong>{{ calendar.title }}</strong>
    {% if calendar.next %}<a class="btn btn-sm btn-outline-light" href="?month={{ calendar.next }}" aria-label="Next month"><i class="bi bi-chevron-right"></i></a>{% else %}<span></span>{% endif %}
  </div>
  <table class="table table-sm text-center mb-2">
    <thead><tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr></thead>
    <tbody>
      {% for week in calendar.weeks %}
        <tr>
          {% for cell in week %}
            {% if cell %}<td class="cal-{{ cell.status }}" title="{{ cell.status|capfirst }}">{{ cell.day }}</td>{% else %}<td></td>{% endif %}
          {% endfor %}
        </tr>
      {% endfor %}
    </tbody>
  </table>
  <div class="small d-flex flex-wrap gap-3">
    <span><span class="legend cal-available"></span> Available</span>
    <span><span class="legend cal-booked"></span> Booked</span>
    <span><span class="legend cal-blocked"></span> Unavailable</span>
  </div>
</div>
